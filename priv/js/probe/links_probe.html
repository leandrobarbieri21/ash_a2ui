<!DOCTYPE html>
<!--
  Links + table-lifts probe page (admin catalog 1.1) — the client half;
  drive with priv/js/probe/links_probe.mjs.

  Loads the admin catalog over the basic catalog and replays recorded
  (synthetic) wire payloads:

    ?payload=links          NotesUI: link cells, badge pills, row click,
                            then the recorded context_select reply
                            (?select=1) for the link-aware detail
    ?payload=links_paged    PagedNotesUI on page 4 of 7: windowed pager
    ?payload=sort           PagedNotesUI (catalog 1.7): sortable headers
    &nb=1                   host tokens set (neobrutalism-like) — proves
                            the grid lines/header are token-driven

  Exposes __feed / __dispatched / __opened (openSurface events) /
  __surfaceId.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>links probe</title>
    <link rel="stylesheet" href="./catalog/ash_a2ui_theme.css" />
    <style id="nb-tokens" media="not all">
      :root {
        --ash-admin-border-width: 3px;
        --ash-admin-grid-header-transform: uppercase;
        --ash-admin-grid-header-background: rgb(10, 20, 30);
        --ash-admin-grid-max-height: 160px;
        --ash-admin-badge-success-background: rgb(0, 200, 80);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "lit": "./nm/lit/index.js",
          "lit/": "./nm/lit/",
          "lit-html": "./nm/lit-html/lit-html.js",
          "lit-html/": "./nm/lit-html/",
          "@lit/reactive-element": "./nm/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "./nm/@lit/reactive-element/",
          "@lit/context": "./nm/@lit/context/index.js",
          "@lit/context/": "./nm/@lit/context/",
          "lit-element": "./nm/lit-element/index.js",
          "lit-element/": "./nm/lit-element/",
          "@a2ui/web_core/": "./nm/@a2ui/web_core/src/",
          "@a2ui/web_core/v0_9": "./nm/@a2ui/web_core/src/v0_9/index.js",
          "@a2ui/web_core/v0_9/basic_catalog": "./nm/@a2ui/web_core/src/v0_9/basic_catalog/index.js",
          "@a2ui/lit/": "./nm/@a2ui/lit/src/",
          "@a2ui/lit/v0_9": "./nm/@a2ui/lit/src/v0_9/index.js",
          "zod": "./nm/zod/index.js",
          "zod/v3": "./nm/zod/v3/index.js",
          "zod/v4": "./nm/zod/v4/index.js",
          "zod/v4-mini": "./nm/zod/v4-mini/index.js",
          "zod/mini": "./nm/zod/mini/index.js",
          "zod/": "./nm/zod/",
          "@preact/signals-core": "./nm/@preact/signals-core/dist/signals-core.mjs",
          "signal-utils": "./nm/signal-utils/dist/index.ts.js",
          "signal-utils/": "./nm/signal-utils/dist/",
          "@lit-labs/signals": "./nm/@lit-labs/signals/index.js",
          "zod-to-json-schema": "./nm/zod-to-json-schema/dist/esm/index.js",
          "date-fns": "./nm/date-fns/index.js"
        }
      }
    </script>
    <script type="module">
      import {html, css, nothing} from "lit";
      import "@a2ui/lit/v0_9";
      import {basicCatalog, A2uiLitElement, A2uiController} from "@a2ui/lit/v0_9";
      import {MessageProcessor, Catalog} from "@a2ui/web_core/v0_9";
      import {createAshAdminCatalog, OPEN_SURFACE_EVENT} from "./catalog/ash_admin_catalog.js";

      const params = new URLSearchParams(location.search);
      if (params.get("nb") === "1") document.getElementById("nb-tokens").media = "all";

      const adminCatalog = createAshAdminCatalog({
        Catalog,
        basicCatalog,
        A2uiLitElement,
        A2uiController,
        lit: {html, css, nothing},
      });

      window.__boot = {stage: "imports-done"};
      window.__dispatched = [];
      window.__opened = [];
      window.addEventListener(OPEN_SURFACE_EVENT, (event) => window.__opened.push(event.detail));

      const caseName = params.get("payload") || "links";
      const surfaceEl = document.createElement("a2ui-surface");
      document.getElementById("host").appendChild(surfaceEl);

      const processor = new MessageProcessor([basicCatalog, adminCatalog], (action) => {
        window.__dispatched.push({name: action.name, context: action.context});
      });
      processor.onSurfaceCreated((surface) => {
        window.__boot.surfaceCreated = true;
        window.__surface = surface;
        surfaceEl.surface = surface;
      });
      window.__feed = (messages) => processor.processMessages(messages);

      try {
        const boot = await (await fetch(`./fixtures/${caseName}_payload.json`)).json();
        window.__surfaceId =
          boot.messages.find((message) => message.createSurface)?.createSurface?.surfaceId ?? null;
        processor.processMessages(boot.messages);
        window.__boot.stage = "booted";
        if (params.get("select") === "1") {
          const select = await (await fetch(`./fixtures/${caseName}_select_payload.json`)).json();
          processor.processMessages(select.messages);
          window.__boot.stage = "selected";
        }
      } catch (error) {
        window.__boot.stage = "error";
        window.__boot.error = String(error);
      }
    </script>
  </head>
  <body>
    <div id="host" style="max-width: 1100px"></div>
  </body>
</html>
