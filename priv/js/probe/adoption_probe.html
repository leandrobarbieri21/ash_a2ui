<!DOCTYPE html>
<!--
  Adoption-findings probe page — the client half; drive with
  priv/js/probe/adoption_probe.mjs. Replays recorded (synthetic) wire
  payloads (priv/js/probe/record_adoption.exs):

    ?payload=adoption_admin   JobsUI under admin_v1: prompt row actions,
                              visible_when per row, the View panel
    ?payload=adoption_board   JobBoardUI (basic composition): lane widths
    ?payload=adoption_basic   JobsUI under the basic composition: prompt
                              widgets, the prompt Modal
    ?payload=adoption_prompt_board[_admin]
                              PromptBoardUI (basic / admin_v1): prompt
                              Modals on board cards
    &catalog=stock            the stock basic catalog only (no AshA2ui
                              overrides) — what any basic renderer shows

  Exposes __feed(messages) / __feedFixture(name) / __dispatched /
  __surface.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>adoption probe</title>
    <link rel="stylesheet" href="./catalog/ash_a2ui_theme.css" />
    <script type="importmap">
      {
        "imports": {
          "lit": "./nm/lit/index.js",
          "lit/": "./nm/lit/",
          "lit-html": "./nm/lit-html/lit-html.js",
          "lit-html/": "./nm/lit-html/",
          "@lit/reactive-element": "./nm/@lit/reactive-element/reactive-element.js",
          "@lit/reactive-element/": "./nm/@lit/reactive-element/",
          "@lit/context": "./nm/@lit/context/index.js",
          "@lit/context/": "./nm/@lit/context/",
          "lit-element": "./nm/lit-element/index.js",
          "lit-element/": "./nm/lit-element/",
          "@a2ui/web_core/": "./nm/@a2ui/web_core/src/",
          "@a2ui/web_core/v0_9": "./nm/@a2ui/web_core/src/v0_9/index.js",
          "@a2ui/web_core/v0_9/basic_catalog": "./nm/@a2ui/web_core/src/v0_9/basic_catalog/index.js",
          "@a2ui/lit/": "./nm/@a2ui/lit/src/",
          "@a2ui/lit/v0_9": "./nm/@a2ui/lit/src/v0_9/index.js",
          "zod": "./nm/zod/index.js",
          "zod/v3": "./nm/zod/v3/index.js",
          "zod/v4": "./nm/zod/v4/index.js",
          "zod/v4-mini": "./nm/zod/v4-mini/index.js",
          "zod/mini": "./nm/zod/mini/index.js",
          "zod/": "./nm/zod/",
          "@preact/signals-core": "./nm/@preact/signals-core/dist/signals-core.mjs",
          "signal-utils": "./nm/signal-utils/dist/index.ts.js",
          "signal-utils/": "./nm/signal-utils/dist/",
          "@lit-labs/signals": "./nm/@lit-labs/signals/index.js",
          "zod-to-json-schema": "./nm/zod-to-json-schema/dist/esm/index.js",
          "date-fns": "./nm/date-fns/index.js",
          "@a2ui/web_core": "./nm/@a2ui/web_core/src/index.js",
          "@a2ui/web_core/catalog": "./nm/@a2ui/web_core/src/catalog/index.js",
          "@a2ui/web_core/state": "./nm/@a2ui/web_core/src/state/index.js",
          "@a2ui/web_core/processing": "./nm/@a2ui/web_core/src/processing/index.js",
          "@a2ui/web_core/resolution": "./nm/@a2ui/web_core/src/resolution/index.js",
          "@a2ui/web_core/rendering": "./nm/@a2ui/web_core/src/resolution/index.js",
          "@a2ui/web_core/validation": "./nm/@a2ui/web_core/src/validation/index.js",
          "@a2ui/web_core/validating": "./nm/@a2ui/web_core/src/validation/integrity-checker.js",
          "@a2ui/web_core/reactivity": "./nm/@a2ui/web_core/src/reactivity/index.js",
          "@a2ui/web_core/expressions": "./nm/@a2ui/web_core/src/expressions/index.js",
          "@a2ui/web_core/adapters": "./nm/@a2ui/web_core/src/processing/adapters/index.js",
          "@a2ui/web_core/rpc": "./nm/@a2ui/web_core/src/rpc/index.js",
          "@a2ui/web_core/errors": "./nm/@a2ui/web_core/src/errors.js",
          "@a2ui/web_core/events": "./nm/@a2ui/web_core/src/common/events.js",
          "@a2ui/web_core/semver": "./nm/@a2ui/web_core/src/common/semver.js",
          "@a2ui/web_core/v0_8": "./nm/@a2ui/web_core/src/v0_8/index.js",
          "@a2ui/web_core/v0_8/basic_catalog": "./nm/@a2ui/web_core/src/v0_8/basic_catalog/index.js",
          "@a2ui/web_core/v0_9/universal": "./nm/@a2ui/web_core/src/v0_9/universal/index.js",
          "@a2ui/web_core/v1_0": "./nm/@a2ui/web_core/src/v1_0/index.js",
          "@a2ui/web_core/v1_0/basic_catalog": "./nm/@a2ui/web_core/src/v1_0/basic_catalog/index.js",
          "@a2ui/lit": "./nm/@a2ui/lit/src/index.js",
          "@a2ui/lit/0.8": "./nm/@a2ui/lit/src/0.8/core.js",
          "@a2ui/lit/v0_8": "./nm/@a2ui/lit/src/0.8/core.js",
          "@a2ui/lit/ui": "./nm/@a2ui/lit/src/0.8/ui/ui.js",
          "@a2ui/web_core/catalogs/basic/v1": "./nm/@a2ui/web_core/src/catalogs/basic/v1/index.js",
          "@a2ui/web_core/universal": "./nm/@a2ui/web_core/src/universal/index.js",
          "validate-color": "./catalog/probe/shims/validate_color.js"
        }
      }
    </script>
    <script type="module">
      import {html, css, nothing} from "lit";
      import "@a2ui/lit/v0_9";
      import {basicCatalog, A2uiLitElement, A2uiController} from "@a2ui/lit/v0_9";
      import {MessageProcessor, Catalog} from "@a2ui/web_core/v0_9";
      import {ChoicePickerApi, ColumnApi} from "@a2ui/web_core/v0_9/basic_catalog";
      import {createAshA2uiCatalog} from "./catalog/ash_a2ui_catalog.js";
      import {createAshAdminCatalog} from "./catalog/ash_admin_catalog.js";

      const params = new URLSearchParams(location.search);
      const lit = {html, css, nothing};
      const stock = params.get("catalog") === "stock";

      const ashCatalog = stock
        ? basicCatalog
        : createAshA2uiCatalog({
            Catalog,
            basicCatalog,
            ChoicePickerApi,
            ColumnApi,
            A2uiLitElement,
            A2uiController,
            lit,
          });
      const adminCatalog = createAshAdminCatalog({
        Catalog,
        basicCatalog: ashCatalog,
        A2uiLitElement,
        A2uiController,
        lit,
      });

      window.__boot = {stage: "imports-done"};
      window.__dispatched = [];

      const caseName = params.get("payload") || "adoption_admin";
      const surfaceEl = document.createElement("a2ui-surface");
      document.getElementById("host").appendChild(surfaceEl);

      const processor = new MessageProcessor([ashCatalog, adminCatalog], (action) => {
        window.__dispatched.push({name: action.name, context: action.context});
      });
      processor.onSurfaceCreated((surface) => {
        window.__boot.surfaceCreated = true;
        window.__surface = surface;
        surfaceEl.surface = surface;
      });
      window.__feed = (messages) => processor.processMessages(messages);
      window.__feedFixture = async (name) => {
        const payload = await (await fetch(`./fixtures/${name}_payload.json`)).json();
        processor.processMessages(payload.messages);
      };

      try {
        await window.__feedFixture(caseName);
        window.__boot.stage = "booted";
      } catch (error) {
        window.__boot.stage = "error";
        window.__boot.error = String(error);
      }
    </script>
  </head>
  <body>
    <div id="host"></div>
  </body>
</html>
